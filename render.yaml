# Render Blueprint — deploys nanobot's gateway + bundled WebUI as one web
# service. Secrets are provided at deploy time as env vars (sync: false) and
# resolved at runtime via the ${VAR} placeholders in render-config.json.
# Nothing secret is stored in this repo.
#
# Durability on the free plan: Render's free instances have NO persistent disk,
# so the container filesystem is recreated on every deploy and after every sleep
# cycle. Instead of a paid disk, this blueprint relies on two native mechanisms:
#
#   1. cron.declarations in render-config.json — the desired schedules live in
#      version control and are re-registered at every startup (idempotent).
#   2. persistence.supabase — the cron store is mirrored to Supabase, restored
#      before the cron service reads it, and snapshotted while the agent runs.
#
# Upgrading to a paid instance? Uncomment the `disk` block at the bottom and
# switch `plan` to `starter`; both mechanisms keep working unchanged.
services:
  - type: web
    name: nanobot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render's Docker Command REPLACES the Dockerfile CMD but keeps the
    # ENTRYPOINT (entrypoint.sh), so pass only the command args here — otherwise
    # the entrypoint path is reinjected as an argument and nanobot fails with
    # "No such command /usr/local/bin/entrypoint.sh". When RENDER=true the
    # entrypoint initializes render-config.json at $HOME/.nanobot/config.json,
    # chowns the directory, drops to the non-root nanobot user, and appends the
    # --config flag itself.
    dockerCommand: gateway
    # Deploy-to-Render templates should not auto-deploy on every repo push
    # (Render's recommendation); trigger deploys manually or via the Dashboard.
    autoDeploy: false
    plan: free
    healthCheckPath: /
    envVars:
      # --- LLM providers -----------------------------------------------------
      # Agnès AI — primary model provider (agnes-2.5-flash).
      - key: AGNES_API_KEY
        sync: false
      # Google Gemini — automatic fallback chain (flash, then pro).
      - key: GEMINI_API_KEY
        sync: false
      # Anthropic — optional, kept available for manual model switching.
      - key: ANTHROPIC_API_KEY
        sync: false

      # --- Composio tool catalogue ------------------------------------------
      # API key from https://app.composio.dev — enables the bridge tools.
      - key: COMPOSIO_API_KEY
        sync: false
      # Stable identity owning the Composio connected accounts (OAuth grants
      # are stored per user id, so this must not change between deploys).
      - key: COMPOSIO_USER_ID
        value: nanobot-owner

      # --- Telegram channel -------------------------------------------------
      # Bot token from @BotFather.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Numeric Telegram user id allowed to command the bot (exact-match
      # allowlist; also the delivery target of the declared cron jobs).
      - key: TELEGRAM_OWNER_ID
        sync: false

      # --- Durable state (replaces the persistent disk) ---------------------
      # Supabase project URL, e.g. https://<ref>.supabase.co
      - key: SUPABASE_URL
        sync: false
      # Supabase service/secret key. The mirror table has RLS enabled, so the
      # publishable key cannot read it. Never commit this value.
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # --- WebUI / gateway --------------------------------------------------
      # Shared secret gating the bundled WebUI (`openssl rand -hex 32`).
      - key: NANOBOT_WEB_TOKEN
        sync: false
      # Port Render routes public traffic to; matches channels.websocket.port
      # in render-config.json.
      - key: PORT
        value: 8765

    # Paid plans only — a persistent disk keeps sessions, memory, and WebUI
    # transcripts on local storage. The Supabase mirror above covers the cron
    # store without it; uncomment (and set plan: starter) for full durability.
    # disk:
    #   name: nanobot-data
    #   mountPath: /home/nanobot/.nanobot
    #   sizeGB: 1
